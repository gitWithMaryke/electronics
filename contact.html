<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact the VOLTIVA team.">
  <title>Contact | VOLTIVA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body data-page="contact">
  <div id="site-header"></div>
  <main class="container py-5">
    <div class="row g-5">
      <div class="col-lg-5">
        <p class="text-uppercase fw-semibold text-secondary mb-1">We’re listening</p>
        <h1 class="display-5 fw-bold">How can we help?</h1>
        <p class="lead mt-3">Questions about a product or an order? Send us a note and our team will be happy to help.</p>
        <p class="mb-1"><strong>Email</strong></p>
        <a class="link-dark" href="mailto:hello@voltiva.example">hello@voltiva.example</a>
        <p class="mt-4 mb-1"><strong>Store hours</strong></p>
        <p>Monday–Saturday, 9:00 am–6:00 pm</p>
      </div>
      <div class="col-lg-7">
        <form id="contact-form" class="border rounded-4 p-4 p-lg-5">
          <div class="mb-3"><label for="contact-name" class="form-label">Your name</label><input id="contact-name" class="form-control" name="name" autocomplete="name" required></div>
          <div class="mb-3"><label for="contact-email" class="form-label">Email address</label><input id="contact-email" class="form-control" name="email" type="email" autocomplete="email" required></div>
          <div class="mb-3"><label for="contact-message" class="form-label">How can we help?</label><textarea id="contact-message" class="form-control" name="message" rows="5" required></textarea></div>
          <button class="btn btn-dark btn-lg" type="submit">Send message</button>
          <p id="contact-feedback" class="mt-3 mb-0" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
