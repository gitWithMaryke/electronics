<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact the VOLTIVA team.">
  <title>Contact | VOLTIVA</title>
  <link href="styles.css" rel="stylesheet">
</head>
<body data-page="contact">
  <div id="site-header"></div>
  <main class="page-width page-main">
    <div class="contact-layout">
      <div>
        <p class="eyebrow">We’re listening</p>
        <h1>How can we help?</h1>
        <p class="intro">Questions about a product or an order? Send us a note and our team will be happy to help.</p>
        <p class="contact-label">Email</p>
        <a href="mailto:hello@voltiva.example">hello@voltiva.example</a>
        <p class="contact-label">Store hours</p>
        <p>Monday–Saturday, 9:00 am–6:00 pm</p>
      </div>
      <form id="contact-form" class="form-panel">
        <div class="field-group"><label for="contact-name">Your name</label><input id="contact-name" name="name" autocomplete="name" required></div>
        <div class="field-group"><label for="contact-email">Email address</label><input id="contact-email" name="email" type="email" autocomplete="email" required></div>
        <div class="field-group"><label for="contact-message">How can we help?</label><textarea id="contact-message" name="message" rows="5" required></textarea></div>
        <button class="button button-dark button-large" type="submit">Send message</button>
        <p id="contact-feedback" class="form-feedback" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="app.js"></script>
</body>
</html>
