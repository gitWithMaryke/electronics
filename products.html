<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse audio, computing, mobile, and home electronics at VOLTIVA.">
  <title>Shop | VOLTIVA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body data-page="products">
  <div id="site-header"></div>
  <main class="container py-5">
    <div class="mb-4">
      <p class="text-uppercase fw-semibold text-secondary mb-1">The collection</p>
      <h1 class="display-5 fw-bold">Find your next favorite</h1>
      <p class="lead">Everyday electronics, thoughtfully selected.</p>
    </div>
    <form id="product-filters" class="row g-3 align-items-end mb-4">
      <div class="col-md-6">
        <label for="product-search" class="form-label">Search products</label>
        <input id="product-search" class="form-control form-control-lg" type="search" placeholder="Try headphones or speaker">
      </div>
      <div class="col-md-4">
        <label for="category-filter" class="form-label">Category</label>
        <select id="category-filter" class="form-select form-select-lg">
          <option value="all">All categories</option>
          <option value="Audio">Audio</option>
          <option value="Computing">Computing</option>
          <option value="Mobile">Mobile</option>
          <option value="Home">Home</option>
        </select>
      </div>
      <div class="col-md-2"><button class="btn btn-dark btn-lg w-100" type="reset">Clear</button></div>
    </form>
    <p id="product-count" class="text-secondary" aria-live="polite"></p>
    <div id="product-list" class="row g-4"></div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
