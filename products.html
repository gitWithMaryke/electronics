<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse audio, computing, mobile, and home electronics at VOLTIVA.">
  <title>Shop | VOLTIVA</title>
  <link href="styles.css" rel="stylesheet">
</head>
<body data-page="products">
  <div id="site-header"></div>
  <main class="page-width page-main">
    <header class="page-intro">
      <p class="eyebrow">The collection</p>
      <h1>Find your next favorite</h1>
      <p class="intro">Everyday electronics, thoughtfully selected.</p>
    </header>
    <form id="product-filters" class="filter-panel">
      <div class="field-group">
        <label for="product-search">Search products</label>
        <input id="product-search" type="search" placeholder="Try headphones or speaker">
      </div>
      <div class="field-group">
        <label for="category-filter">Category</label>
        <select id="category-filter">
          <option value="all">All categories</option>
          <option value="Audio">Audio</option>
          <option value="Computing">Computing</option>
          <option value="Mobile">Mobile</option>
          <option value="Home">Home</option>
        </select>
      </div>
      <button class="button button-dark" type="reset">Clear</button>
    </form>
    <p id="product-count" class="muted-copy" aria-live="polite"></p>
    <div id="product-list" class="product-grid"></div>
  </main>
  <div id="site-footer"></div>
  <script src="app.js"></script>
</body>
</html>
